# ─────────────────────────────────────────────────────────────────────────────
# DevSecOps Engine v1.3 — Workflow Reutilizable
# Trabajo de Grado — Universidad del Valle 2026
# Jhojan Stiven Castaño Jejen & Juan Manuel Arango Rodas
# ─────────────────────────────────────────────────────────────────────────────
name: DevSecOps Engine — Pipeline Reutilizable

on:
  workflow_call:
    inputs:
      target_image:
        description: "Imagen Docker completa (ghcr.io/org/app:sha o usuario/app:tag)"
        type: string
        required: false
        default: ""
      target_url:
        description: "URL de la app desplegada (alternativa a target_image)"
        type: string
        required: false
        default: ""
      target_port:
        description: "Puerto expuesto por el contenedor"
        type: string
        required: false
        default: "8080"
      service_name:
        description: "Nombre del servicio — aparece en el reporte"
        type: string
        required: true
      criticality:
        description: "Nivel de criticidad: low | medium | high | critical"
        type: string
        required: false
        default: "medium"
      environment:
        description: "Entorno de ejecución: staging | pre-prod"
        type: string
        required: false
        default: "staging"
      source_repo:
        description: "Repositorio cuyo código escanea Semgrep (org/repo)"
        type: string
        required: false
        default: ""
      source_repo_ref:
        description: "Rama del repositorio fuente"
        type: string
        required: false
        default: "main"
      language:
        description: "Override de lenguaje: auto | nodejs | python | java | php | golang"
        type: string
        required: false
        default: "auto"
      use_ghcr:
        description: "true si la imagen está en GitHub Container Registry privado"
        type: boolean
        required: false
        default: false
    secrets:
      GROQ_API_KEY:
        description: "API Key de Groq (LLaMA 3.3 70B — motor IA principal)"
        required: true
      GHCR_TOKEN:
        description: "Token de acceso a GHCR (requerido si use_ghcr = true)"
        required: false
      OPENAI_API_KEY:
        description: "API Key de OpenAI (fallback secundario del motor IA)"
        required: false
      ANTHROPIC_API_KEY:
        description: "API Key de Anthropic Claude (fallback terciario del motor IA)"
        required: false
      APP_SECRETS:
        description: "Variables de entorno de la app en formato KEY=VALUE separadas por espacio"
        required: false

# ─────────────────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 0: Auto-detector de contexto
  # Genera scan_config.json con lenguaje, modo de escaneo y ASCs ISO/IEC 27034
  # ───────────────────────────────────────────────────────────────────────────
  detector:
    name: "Job 0 — Auto-detector (ISO/IEC 27034 ANF)"
    runs-on: ubuntu-latest
    outputs:
      language:    ${{ steps.detect.outputs.language }}
      scan_mode:   ${{ steps.detect.outputs.scan_mode }}
      has_openapi: ${{ steps.detect.outputs.has_openapi }}

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Checkout source repo (si se especificó)
        if: inputs.source_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref:        ${{ inputs.source_repo_ref }}
          token:      ${{ secrets.GHCR_TOKEN || github.token }}
          path:       source_repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run detector
        id: detect
        run: |
          # Determinar path a analizar
          TARGET_PATH="."
          if [ -d "source_repo" ]; then TARGET_PATH="source_repo"; fi

          python scripts/detector.py \
            --service      "${{ inputs.service_name }}" \
            --criticality  "${{ inputs.criticality }}" \
            --environment  "${{ inputs.environment }}" \
            --target-image "${{ inputs.target_image }}" \
            --target-url   "${{ inputs.target_url }}" \
            --path         "$TARGET_PATH" \
            --output       results/scan_config.json

          # Inyectar campos adicionales que el detector no escribe pero el pipeline necesita
          python3 -c "
          import json
          cfg = json.load(open('results/scan_config.json'))
          cfg.setdefault('language', '${{ inputs.language }}')
          cfg.setdefault('scan_mode', 'image' if '${{ inputs.target_image }}' else ('url' if '${{ inputs.target_url }}' else 'filesystem'))
          cfg.setdefault('iso27034_anf', {
              'required_ascs': ['ASC-SAST-001','ASC-SCA-001','ASC-DAST-001','ASC-PENTEST-001'],
              'optional_ascs': []
          })
          json.dump(cfg, open('results/scan_config.json','w'), indent=2)
          " 

          _LANG=$(python3 -c "import json; v=json.load(open('results/scan_config.json')).get('language','auto'); print(v.get('primary','auto') if isinstance(v,dict) else v)")
          echo "language=$_LANG" >> $GITHUB_OUTPUT
          _MODE=$(python3 -c "import json; v=json.load(open('results/scan_config.json')).get('scan_mode','unknown'); print(v.get('mode','unknown') if isinstance(v,dict) else v)")
          echo "scan_mode=$_MODE"  >> $GITHUB_OUTPUT
          echo "has_openapi=$(python -c "import json; cfg=json.load(open('results/scan_config.json')); print(str(bool(cfg.get('openapi_spec'))).lower())")" >> $GITHUB_OUTPUT

      - name: Asegurar scan_config.json válido
        if: always()
        run: |
          mkdir -p results
          if [ ! -s results/scan_config.json ]; then
            cat > results/scan_config.json << 'EOJSON'
          {
            "service": "${{ inputs.service_name }}",
            "language": "${{ inputs.language }}",
            "business_criticality": "${{ inputs.criticality }}",
            "environment": "${{ inputs.environment }}",
            "scan_mode": "image",
            "iso27034_anf": {
              "required_ascs": ["ASC-SAST-001","ASC-SCA-001","ASC-DAST-001","ASC-PENTEST-001"],
              "optional_ascs": []
            }
          }
          EOJSON
          fi


      - name: Upload scan_config
        uses: actions/upload-artifact@v4
        with:
          name: scan-config
          path: results/scan_config.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: SAST — Semgrep OSS (ASC-SAST-001)
  # ───────────────────────────────────────────────────────────────────────────
  sast:
    name: "Job 1 — SAST (Semgrep OSS) [ASC-SAST-001]"
    runs-on: ubuntu-latest
    needs: detector

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Checkout source repo
        if: inputs.source_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref:        ${{ inputs.source_repo_ref }}
          token:      ${{ secrets.GHCR_TOKEN || github.token }}
          path:       source_repo

      - name: Install Semgrep
        run: pip install semgrep --quiet

      - name: Run Semgrep
        run: |
          # El detector emite language como dict; extraer solo el valor de 'primary'
          RAW="${{ needs.detector.outputs.language }}"
          if echo "$RAW" | grep -q "'primary'"; then
            LANG=$(echo "$RAW" | grep -o "'primary': '[^']*'" | grep -o "'[^']*'$" | tr -d "'")
          else
            LANG="$RAW"
          fi
          RULES="p/generic"
          case "$LANG" in
            nodejs|javascript) RULES="p/nodejs p/javascript" ;;
            python)            RULES="p/python" ;;
            java)              RULES="p/java" ;;
            php)               RULES="p/php" ;;
            golang)            RULES="p/golang" ;;
            csharp)            RULES="p/csharp" ;;
          esac
          echo "Lenguaje: $LANG | Reglas: $RULES" 

          TARGET="."
          if [ -d "source_repo" ]; then TARGET="source_repo"; fi

          semgrep scan \
            --config $RULES \
            --json \
            --output results/semgrep_results.json \
            $TARGET || true

      - name: Asegurar semgrep_results.json válido
        if: always()
        run: |
          mkdir -p results
            echo '{"results":[],"errors":[]}' > results/semgrep_results.json

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: results/semgrep_results.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: SCA — Trivy (ASC-SCA-001)
  # ───────────────────────────────────────────────────────────────────────────
  sca:
    name: "Job 2 — SCA (Trivy) [ASC-SCA-001]"
    runs-on: ubuntu-latest
    needs: detector

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Login a GHCR (si use_ghcr = true)
        if: inputs.use_ghcr == true && inputs.target_image != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Crear directorio de resultados
        run: mkdir -p results

      - name: Run Trivy sobre imagen
        if: inputs.target_image != ''
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:    ${{ inputs.target_image }}
          format:       json
          output:       results/trivy_results.json
          severity:     CRITICAL,HIGH,MEDIUM,LOW
          exit-code:    "0"
        continue-on-error: true

      - name: Run Trivy sobre filesystem (si no hay imagen)
        if: inputs.target_image == ''
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:  fs
          scan-ref:   ${{ inputs.source_repo != '' && 'source_repo' || '.' }}
          format:     json
          output:     results/trivy_results.json
          severity:   CRITICAL,HIGH,MEDIUM,LOW
          exit-code:  "0"
        continue-on-error: true

      - name: Asegurar trivy_results.json válido
        if: always()
        run: |
          mkdir -p results
            echo '{"Results":[]}' > results/trivy_results.json

      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: results/trivy_results.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Reconocimiento de superficie de ataque
  # ───────────────────────────────────────────────────────────────────────────
  recon:
    name: "Job 3 — Reconocimiento activo"
    runs-on: ubuntu-latest
    needs: detector
    outputs:
      app_url:   ${{ steps.recon.outputs.app_url }}
      app_alive: ${{ steps.recon.outputs.app_alive }}

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Login a GHCR (si use_ghcr = true)
        if: inputs.use_ghcr == true && inputs.target_image != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Arrancar contenedor (si hay imagen)
        if: inputs.target_image != ''
        run: |
          ENV_ARGS=""
          if [ -n "${{ secrets.APP_SECRETS }}" ]; then
            for pair in ${{ secrets.APP_SECRETS }}; do
              ENV_ARGS="$ENV_ARGS -e $pair"
            done
          fi
          docker run -d --name target_app \
            $ENV_ARGS \
            -p "${{ inputs.target_port }}:${{ inputs.target_port }}" \
            "${{ inputs.target_image }}"
          sleep 15

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install recon dependencies
        run: pip install requests httpx --quiet

      - name: Run recon
        id: recon
        run: |
          APP_URL="${{ inputs.target_url }}"
          if [ -z "$APP_URL" ] && [ -n "${{ inputs.target_image }}" ]; then
            APP_URL="http://localhost:${{ inputs.target_port }}"
          fi

          python scripts/recon.py \
            --target "$APP_URL" \
            --output results/recon_context.json || true

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "app_alive=true"  >> $GITHUB_OUTPUT
          else
            echo "app_alive=false" >> $GITHUB_OUTPUT
          fi
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

      - name: Asegurar recon_context.json válido
        if: always()
        run: |
          mkdir -p results
            echo '{"target_url":"","host":"","port":"","summary":{}}' > results/recon_context.json

      - name: Upload recon results
        uses: actions/upload-artifact@v4
        with:
          name: recon-results
          path: results/recon_context.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: DAST — OWASP ZAP (ASC-DAST-001)
  # ───────────────────────────────────────────────────────────────────────────
  dast:
    name: "Job 4 — DAST (OWASP ZAP) [ASC-DAST-001]"
    runs-on: ubuntu-latest
    needs: [detector, recon]
    if: needs.recon.outputs.app_alive == 'true'

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Login a GHCR (si use_ghcr = true)
        if: inputs.use_ghcr == true && inputs.target_image != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Arrancar contenedor
        if: inputs.target_image != ''
        run: |
          ENV_ARGS=""
          if [ -n "${{ secrets.APP_SECRETS }}" ]; then
            for pair in ${{ secrets.APP_SECRETS }}; do
              ENV_ARGS="$ENV_ARGS -e $pair"
            done
          fi
          docker run -d --name target_app \
            $ENV_ARGS \
            -p "${{ inputs.target_port }}:${{ inputs.target_port }}" \
            "${{ inputs.target_image }}"
          sleep 15

      - name: Run ZAP Baseline Scan
        run: |
          APP_URL="${{ needs.recon.outputs.app_url }}"
          mkdir -p results zap_output
          docker run --rm \
            --network host \
            -v $(pwd)/zap_output:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "$APP_URL" \
            -J zap_results.json \
            -I || true
          if [ -f zap_output/zap_results.json ]; then
            sudo cp zap_output/zap_results.json results/zap_results.json
            sudo chown $USER:$USER results/zap_results.json
          else
            echo '{"site":[]}' > results/zap_results.json
          fi


      - name: Asegurar zap_results.json válido
        if: always()
        run: |
          mkdir -p results
          [ -s results/zap_results.json ] || echo '{"site":[]}' > results/zap_results.json


      - name: Upload DAST results
        uses: actions/upload-artifact@v4
        with:
          name: dast-results
          path: results/zap_results.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5: Pentesting — Nuclei (ASC-PENTEST-001)
  # ───────────────────────────────────────────────────────────────────────────
  pentest:
    name: "Job 5 — Pentesting (Nuclei v3) [ASC-PENTEST-001]"
    runs-on: ubuntu-latest
    needs: [detector, recon]
    if: needs.recon.outputs.app_alive == 'true'

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Login a GHCR (si use_ghcr = true)
        if: inputs.use_ghcr == true && inputs.target_image != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Arrancar contenedor
        if: inputs.target_image != ''
        run: |
          ENV_ARGS=""
          if [ -n "${{ secrets.APP_SECRETS }}" ]; then
            for pair in ${{ secrets.APP_SECRETS }}; do
              ENV_ARGS="$ENV_ARGS -e $pair"
            done
          fi
          docker run -d --name target_app \
            $ENV_ARGS \
            -p "${{ inputs.target_port }}:${{ inputs.target_port }}" \
            "${{ inputs.target_image }}"
          sleep 15

      - name: Install Nuclei
        run: |
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          sudo cp $(go env GOPATH)/bin/nuclei /usr/local/bin/nuclei
          nuclei -version
      - name: Run Nuclei
        run: |
          APP_URL="${{ needs.recon.outputs.app_url }}"
          nuclei \
            -u "$APP_URL" \
            -severity critical,high,medium \
            -json \
            -o results/nuclei_results.json \
            -timeout 10 || true

      - name: Asegurar nuclei_results.json válido
        if: always()
        run: |
          mkdir -p results
            echo '[]' > results/nuclei_results.json

      - name: Upload pentest results
        uses: actions/upload-artifact@v4
        with:
          name: pentest-results
          path: results/nuclei_results.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6: Evaluación
  # Normalización + Gate IA Híbrido + SSVC + ISO/IEC 27034 + Reporte
  # Siempre se ejecuta (if: always()) para garantizar el reporte aunque
  # alguna herramienta falle parcialmente.
  # ───────────────────────────────────────────────────────────────────────────
  evaluation:
    name: "Job 6 — Evaluación (Normalización + Gate IA + SSVC + ISO 27034)"
    runs-on: ubuntu-latest
    needs: [detector, sast, sca, recon, dast, pentest]
    if: always()

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install requests openai anthropic groq --quiet

      - name: Crear directorio de resultados
        run: mkdir -p results

      # ── Descargar artefactos de jobs anteriores ─────────────────────────────
      - name: Download scan_config
        uses: actions/download-artifact@v4
        with:
          name: scan-config
          path: results/
        continue-on-error: true

      - name: Download SAST results
        uses: actions/download-artifact@v4
        with:
          name: sast-results
          path: results/
        continue-on-error: true

      - name: Download SCA results
        uses: actions/download-artifact@v4
        with:
          name: sca-results
          path: results/
        continue-on-error: true

      - name: Download recon results
        uses: actions/download-artifact@v4
        with:
          name: recon-results
          path: results/
        continue-on-error: true

      - name: Download DAST results
        uses: actions/download-artifact@v4
        with:
          name: dast-results
          path: results/
        continue-on-error: true

      - name: Download pentest results
        uses: actions/download-artifact@v4
        with:
          name: pentest-results
          path: results/
        continue-on-error: true

      # ── Crear archivos vacíos para herramientas que no ejecutaron ────────────
      - name: Asegurar archivos de resultados
        run: |
          mkdir -p results
          # Crear archivos con JSON vacío válido si no existen o están vacíos
          [ -s results/semgrep_results.json ] || echo '{"results":[],"errors":[]}' > results/semgrep_results.json
          [ -s results/trivy_results.json ]   || echo '{"Results":[]}'             > results/trivy_results.json
          [ -s results/zap_results.json ]     || echo '{"site":[]}'                > results/zap_results.json
          [ -s results/nuclei_results.json ]  || echo '[]'                         > results/nuclei_results.json
          [ -s results/recon_context.json ]   || echo '{"target_url":"","summary":{}}' > results/recon_context.json
          [ -s results/scan_config.json ]     || echo '{}' > results/scan_config.json

          # scan_config mínimo con ANF si el detector falló
          python3 -c "
          import json, os
          cfg_path = 'results/scan_config.json'
          if os.path.getsize(cfg_path) == 0:
              json.dump({
                  'service': '${{ inputs.service_name }}',
                  'language': '${{ inputs.language }}',
                  'business_criticality': '${{ inputs.criticality }}',
                  'environment': '${{ inputs.environment }}',
                  'scan_mode': 'image' if '${{ inputs.target_image }}' else 'url',
                  'iso27034_anf': {
                      'required_ascs': [
                          'ASC-SAST-001',
                          'ASC-SCA-001',
                          'ASC-DAST-001',
                          'ASC-PENTEST-001'
                      ],
                      'optional_ascs': []
                  }
              }, open(cfg_path, 'w'), indent=2)
          " || true

      # ── Paso 1: Normalización y deduplicación ──────────────────────────────
      - name: Normalización de hallazgos
        run: |
          python scripts/normalizer.py \
            --semgrep results/semgrep_results.json \
            --trivy   results/trivy_results.json \
            --zap     results/zap_results.json \
            --nuclei  results/nuclei_results.json \
            --output  results/findings.json

          # Inyectar metadatos de servicio y scan_config en findings.json
          python3 -c "
          import json, os
          findings = json.load(open('results/findings.json'))
          findings['service']              = '${{ inputs.service_name }}'
          findings['environment']          = '${{ inputs.environment }}'
          findings['business_criticality'] = '${{ inputs.criticality }}'
          findings['pipeline_run']         = os.environ.get('GITHUB_RUN_ID', 'local')
          # Propagar asc_id desde scan_config si el normalizer no lo hace
          cfg_path = 'results/scan_config.json'
          if os.path.exists(cfg_path) and os.path.getsize(cfg_path) > 0:
              cfg = json.load(open(cfg_path))
              tool_asc = {
                  'semgrep': 'ASC-SAST-001',
                  'trivy':   'ASC-SCA-001',
                  'zap':     'ASC-DAST-001',
                  'nuclei':  'ASC-PENTEST-001',
              }
              for f in findings.get('findings', []):
                  if not f.get('asc_id'):
                      f['asc_id'] = tool_asc.get(f.get('tool',''), '')
          json.dump(findings, open('results/findings.json','w'), indent=2)
          " 

      # ── Paso 2: Gate SSVC + EPSS + CISA KEV ───────────────────────────────
      - name: Gate SSVC + EPSS + CISA KEV
        run: |
          python scripts/ssvc_gate.py \
            results/findings.json \
            "${{ inputs.criticality }}" \
            > results/ssvc_result.json 2>/dev/null || echo '{}' > results/ssvc_result.json
        continue-on-error: true

      # ── Paso 3: Motor de evaluación IA híbrida ─────────────────────────────
      - name: Evaluación IA híbrida (LLaMA 3.3 70B + fallback)
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/ai_engine.py \
            --findings    results/findings.json \
            --service     "${{ inputs.service_name }}" \
            --criticality "${{ inputs.criticality }}" \
            --environment "${{ inputs.environment }}" \
            --output      results/ai_evaluation.json

      # ── Paso 4: Security Gate (consolidación 3 enfoques) ──────────────────
      - name: Security Gate (tradicional + IA + SSVC)
        run: |
          python scripts/gate.py \
            --findings      results/findings.json \
            --ai-evaluation results/ai_evaluation.json \
            --criticality   "${{ inputs.criticality }}" \
            --output        results/gate_decision.json

      # ── Paso 5: Reporte con trazabilidad ISO/IEC 27034 ────────────────────
      - name: Generar reporte SECURITY_REPORT.md
        run: |
          python scripts/report_generator.py \
            --findings      results/findings.json \
            --ai-evaluation results/ai_evaluation.json \
            --gate-decision results/gate_decision.json \
            --recon         results/recon_context.json \
            --scan-config   results/scan_config.json \
            --output        results/SECURITY_REPORT.md

      # ── Subir todos los artefactos finales ────────────────────────────────
      - name: Upload resultados finales
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-results-${{ inputs.service_name }}
          path: |
            results/scan_config.json
            results/findings.json
            results/ssvc_result.json
            results/ai_evaluation.json
            results/gate_decision.json
            results/SECURITY_REPORT.md

      # ── Mostrar decisión en el log ─────────────────────────────────────────
      - name: Mostrar decisión de despliegue
        if: always()
        run: |
          echo "=================================================="
          echo "  DECISIÓN DEL SECURITY GATE"
          echo "=================================================="
          python3 -c "
          import json
          try:
              gate = json.load(open('results/gate_decision.json'))
              dec  = gate.get('decision', 'UNKNOWN')
              src  = gate.get('decision_source', 'N/A')
              icon = {'PASS':'✅','FAIL':'❌','CONDITIONAL':'⚠️'}.get(dec,'❓')
              print(f'  {icon} Decisión:  {dec}')
              print(f'  📋 Fuente:    {src}')
              ssvc = gate.get('gate_comparison',{}).get('ssvc',{})
              f1   = ssvc.get('f1_metrics',{}).get('f1_score','N/A')
              agg  = ssvc.get('aggregate_action','N/A')
              print(f'  🔬 SSVC:      {ssvc.get(\"decision\",\"N/A\")} ({agg})')
              print(f'  📊 F1 Score:  {f1}')
              tra  = gate.get('iso27034_traceability', {})
              bd   = tra.get('asc_breakdown', [])
              req  = [b for b in bd if b.get('required')]
              exr  = [b for b in req if b.get('status') == 'executed']
              print(f'  📋 ISO 27034: {len(exr)}/{len(req)} ASC obligatorios ejecutados')
          except Exception as e:
              print(f'  ⚠️  No se pudo leer gate_decision.json: {e}')
          " || true
          echo "=================================================="

      # ── Forzar fallo si la decisión es FAIL ───────────────────────────────
      - name: Verificar decisión de despliegue
        run: |
          DECISION=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('results/gate_decision.json')).get('decision','UNKNOWN')
              print(d)
          except:
              print('UNKNOWN')
          " 2>/dev/null || echo "UNKNOWN")

          echo "Decisión: $DECISION"

          if [ "$DECISION" = "FAIL" ]; then
            echo "❌ El Security Gate bloqueó el despliegue (FAIL)."
            echo "   Revisa SECURITY_REPORT.md en los artefactos para los detalles."
            exit 1
          elif [ "$DECISION" = "CONDITIONAL" ]; then
            echo "⚠️  CONDITIONAL — revisar SECURITY_REPORT.md antes de promover a producción."
          else
            echo "✅ PASS — El despliegue puede proceder."
          fi