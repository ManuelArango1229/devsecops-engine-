# ─────────────────────────────────────────────────────────────────────────────
# DevSecOps Engine — Pipeline Reutilizable (FUSIÓN)
# Trabajo de Grado — Universidad del Valle 2026
# Jhojan Stiven Castaño Jejen & Juan Manuel Arango Rodas
#
# Jobs 0-5: lógica verificada del pipeline estable (v2) — guardias, argumentos
#           de scripts y herramientas de recon confirmados contra los scripts
#           reales del repo.
# Job 6:    tomado de la versión en curso — motor SSVC + trazabilidad ISO/IEC
#           27034 (asc_id) + gate de despliegue, no presente en la v2 vieja.
# ─────────────────────────────────────────────────────────────────────────────
name: DevSecOps Engine — Pipeline Reutilizable

on:
  workflow_call:
    inputs:
      # ── Target ───────────────────────────────────────────────────────────
      target_image:
        description: 'Imagen Docker del target (ej: bkimminich/juice-shop o ghcr.io/org/app:sha)'
        required: false
        type: string
        default: ''
      target_url:
        description: 'URL externa si la app ya está desplegada (sin Docker)'
        required: false
        type: string
        default: ''
      target_port:
        description: 'Puerto donde corre la app (ej: 3000)'
        required: false
        type: string
        default: '8080'

      # ── Metadata del servicio ─────────────────────────────────────────────
      service_name:
        description: 'Nombre del servicio para el reporte'
        required: true
        type: string
      criticality:
        description: 'Criticidad del negocio: high, medium, low'
        required: false
        type: string
        default: 'medium'
      environment:
        description: 'Entorno: staging, pre-prod'
        required: false
        type: string
        default: 'staging'

      # ── Build ─────────────────────────────────────────────────────────────
      build_context:
        description: 'Carpeta del Dockerfile si se construye local (opcional)'
        required: false
        type: string
        default: ''
      use_ghcr:
        description: 'true si la imagen está en GHCR privado y necesita login con GHCR_TOKEN'
        required: false
        type: boolean
        default: false

      # ── SAST: código fuente externo ───────────────────────────────────────
      source_repo:
        description: >
          Repo cuyo código fuente se escaneará con Semgrep.
          Formato: 'owner/repo' (ej: ManuelArango1229/Backend-FitFusion).
          Si se omite, Semgrep escanea el código del engine.
        required: false
        type: string
        default: ''
      source_repo_ref:
        description: 'Branch/tag/sha del source_repo a clonar (default: main)'
        required: false
        type: string
        default: 'main'

      # ── Lenguaje (override del auto-detector) ─────────────────────────────
      language:
        description: >
          Forzar lenguaje para Semgrep: nodejs, python, java, go, dotnet, php.
          Si se omite, se auto-detecta del código del engine o del source_repo.
        required: false
        type: string
        default: ''

    secrets:
      # ── IA ────────────────────────────────────────────────────────────────
      GROQ_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false

      # ── Runtime secrets del target ────────────────────────────────────────
      # Formato: "KEY1=valor1,KEY2=valor2,KEY3=valor3"
      # El caller extrae sus propios secrets de GitHub y los concatena aquí.
      #   APP_SECRETS: "MONGO_URI=${{ secrets.MONGO_URI }},JWT_SECRET=${{ secrets.JWT_SECRET }}"
      APP_SECRETS:
        required: false

      # Token para hacer pull de imágenes privadas en GHCR
      GHCR_TOKEN:
        required: false

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 0: Auto-detector de contexto (ISO/IEC 27034 ANF)
  # ───────────────────────────────────────────────────────────────────────────
  detector:
    name: "Job 0 — Auto-detector (ISO/IEC 27034 ANF)"
    runs-on: ubuntu-latest
    outputs:
      language:      ${{ steps.detect.outputs.language }}
      scan_mode:     ${{ steps.detect.outputs.scan_mode }}
      dast_enabled:  ${{ steps.detect.outputs.dast_enabled }}
      semgrep_rules: ${{ steps.detect.outputs.semgrep_rules }}
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      # Si hay source_repo, clonarlo para que el detector detecte su lenguaje
      - name: Checkout source repo (si aplica)
        if: ${{ inputs.source_repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_repo_ref }}
          path: source_to_scan
          token: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar estructura del engine
        run: |
          if [ ! -f scripts/detector.py ]; then
            echo "❌ FATAL: scripts/detector.py no existe"
            ls -la scripts/ 2>/dev/null || echo "scripts/ vacío"
            exit 1
          fi
          echo "✅ scripts/detector.py encontrado"

      - name: Run detector
        id: detect
        run: |
          mkdir -p results

          # Analizar source_repo si existe, si no el engine
          DETECT_PATH="."
          if [ -n "${{ inputs.source_repo }}" ] && [ -d "source_to_scan" ]; then
            DETECT_PATH="source_to_scan"
            echo "🔍 Detectando lenguaje en: ${{ inputs.source_repo }}"
          fi

          python3 scripts/detector.py \
            --path "$DETECT_PATH" \
            --output results/scan_config.json \
            --target-image "${{ inputs.target_image }}" \
            --target-url   "${{ inputs.target_url }}" \
            --service      "${{ inputs.service_name }}" \
            --criticality  "${{ inputs.criticality }}" \
            --environment  "${{ inputs.environment }}"

          python3 -c "
          import json, sys
          d = json.load(open('results/scan_config.json'))
          needed = ['language', 'scan_mode', 'summary', 'tools', 'service']
          missing = [k for k in needed if k not in d]
          if missing:
              print('❌ scan_config.json incompleto:', missing)
              sys.exit(1)
          print('✅ scan_config.json válido')
          print('   service   :', d['service'])
          print('   language  :', d['language']['primary'])
          print('   scan_mode :', d['scan_mode']['mode'])
          print('   dast      :', d['summary']['dast_enabled'])
          "

          LANG=$(python3 -c "import json; d=json.load(open('results/scan_config.json')); print(d['language']['primary'])")
          MODE=$(python3 -c "import json; d=json.load(open('results/scan_config.json')); print(d['scan_mode']['mode'])")
          DAST=$(python3 -c "import json; d=json.load(open('results/scan_config.json')); print(str(d['summary']['dast_enabled']).lower())")

          # Override de lenguaje si el caller lo especifica
          if [ -n "${{ inputs.language }}" ]; then
            LANG="${{ inputs.language }}"
            echo "⚡ Lenguaje forzado por el caller: $LANG"
          fi

          # Resolver reglas Semgrep según el lenguaje final
          RULES=$(python3 -c "
          rulesets = {
              'nodejs':  'p/nodejs p/javascript',
              'python':  'p/python',
              'java':    'p/java',
              'go':      'p/golang',
              'golang':  'p/golang',
              'dotnet':  'p/csharp',
              'csharp':  'p/csharp',
              'php':     'p/php',
              'generic': 'p/generic',
          }
          print(rulesets.get('$LANG', 'p/generic'))
          ")

          echo "language=$LANG"        >> $GITHUB_OUTPUT
          echo "scan_mode=$MODE"       >> $GITHUB_OUTPUT
          echo "dast_enabled=$DAST"    >> $GITHUB_OUTPUT
          echo "semgrep_rules=$RULES"  >> $GITHUB_OUTPUT
          echo "✅ Lenguaje: $LANG | Modo: $MODE | DAST: $DAST | Reglas: $RULES"

      - name: Upload scan-config
        uses: actions/upload-artifact@v4
        with:
          name: scan-config
          path: results/scan_config.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: SAST — Semgrep OSS (ASC-SAST-001)
  # ───────────────────────────────────────────────────────────────────────────
  sast:
    name: "Job 1 — SAST (Semgrep OSS) [ASC-SAST-001]"
    runs-on: ubuntu-latest
    needs: detector
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      # Clonar el source_repo si el caller lo especificó
      - name: Checkout source repo para SAST
        if: ${{ inputs.source_repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_repo_ref }}
          path: source_to_scan
          token: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Install Semgrep
        run: pip install semgrep --quiet

      - name: Run Semgrep
        run: |
          mkdir -p results
          RULES="${{ needs.detector.outputs.semgrep_rules }}"

          # Escanear el source_repo si existe, si no el engine
          SCAN_PATH="."
          if [ -n "${{ inputs.source_repo }}" ] && [ -d "source_to_scan" ]; then
            SCAN_PATH="source_to_scan"
            echo "🔍 Semgrep escaneando: ${{ inputs.source_repo }}"
          else
            echo "🔍 Semgrep escaneando: engine (source_repo no especificado)"
          fi

          echo "Usando reglas: $RULES | Path: $SCAN_PATH"

          # Semgrep necesita un --config por cada ruleset; si se pasa
          # "p/nodejs p/javascript" como un solo string, el segundo valor
          # se interpreta como scanning root en vez de config y falla con
          # "Invalid scanning root: p/javascript".
          CONFIG_ARGS=()
          for r in $RULES; do
            CONFIG_ARGS+=(--config "$r")
          done

          set +e
          semgrep \
            "${CONFIG_ARGS[@]}" \
            --json \
            --output results/semgrep_results.json \
            --timeout 300 \
            --no-error "$SCAN_PATH"
          SEMGREP_EXIT=$?
          set -e
          echo "Semgrep exit code: $SEMGREP_EXIT"

          if [ ! -f results/semgrep_results.json ] || [ ! -s results/semgrep_results.json ]; then
            echo '{"results":[],"errors":[],"version":"1.0"}' > results/semgrep_results.json
          fi

          python3 -c "
          import json
          d = json.load(open('results/semgrep_results.json'))
          errs = d.get('errors', [])
          for e in errs[:3]:
              print('  ⚠️ Semgrep error:', e.get('message',''))
          print(f'Semgrep done: {len(d.get(\"results\",[]))} findings, {len(errs)} errores')
          "

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: results/semgrep_results.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: SCA — Trivy (ASC-SCA-001)
  # ───────────────────────────────────────────────────────────────────────────
  sca:
    name: "Job 2 — SCA (Trivy) [ASC-SCA-001]"
    runs-on: ubuntu-latest
    needs: detector
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main \
            | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      # Login a GHCR si hay token (para imágenes privadas)
      - name: Login GHCR (imágenes privadas)
        if: ${{ inputs.use_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull imagen Docker
        if: ${{ inputs.target_image != '' && inputs.target_url == '' }}
        run: |
          docker rm -f target-trivy 2>/dev/null || true
          if [ -n "${{ inputs.build_context }}" ]; then
            docker build -t ${{ inputs.target_image }} ${{ inputs.build_context }}
          else
            docker pull ${{ inputs.target_image }}
          fi
          echo "✅ Imagen lista: ${{ inputs.target_image }}"

      - name: Run Trivy – imagen Docker
        if: ${{ inputs.target_image != '' && inputs.target_url == '' }}
        run: |
          mkdir -p results
          trivy image \
            --format json \
            --output results/trivy_results.json \
            --severity CRITICAL,HIGH,MEDIUM \
            --scanners vuln,secret,misconfig \
            --no-progress \
            ${{ inputs.target_image }} || true

          COUNT=$(python3 -c "
          import json
          d = json.load(open('results/trivy_results.json'))
          t = sum(len(r.get('Vulnerabilities') or []) for r in d.get('Results', []))
          print(t)
          " 2>/dev/null || echo 0)
          echo "Trivy image done: $COUNT vulnerabilidades"

      - name: Run Trivy – filesystem
        if: ${{ inputs.target_image == '' || inputs.target_url != '' }}
        run: |
          mkdir -p results
          trivy fs \
            --format json \
            --output results/trivy_results.json \
            --severity CRITICAL,HIGH,MEDIUM \
            --scanners vuln,secret,misconfig \
            --no-progress \
            . || true
          echo "Trivy filesystem done"

      - name: Garantizar reporte Trivy válido
        if: always()
        run: |
          mkdir -p results
          if [ ! -f results/trivy_results.json ] || [ ! -s results/trivy_results.json ]; then
            echo '{"Results":[]}' > results/trivy_results.json
          fi

      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: results/trivy_results.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Reconocimiento activo
  # ───────────────────────────────────────────────────────────────────────────
  recon:
    name: "Job 3 — Reconocimiento activo"
    runs-on: ubuntu-latest
    needs: detector
    if: needs.detector.outputs.dast_enabled == 'true'
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Login a GHCR si hay token
      - name: Login GHCR (imágenes privadas)
        if: ${{ inputs.use_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull imagen Docker
        if: ${{ inputs.target_image != '' && inputs.target_url == '' }}
        run: |
          docker rm -f target-app 2>/dev/null || true
          if [ -n "${{ inputs.build_context }}" ]; then
            docker build -t ${{ inputs.target_image }} ${{ inputs.build_context }}
          else
            docker pull ${{ inputs.target_image }}
          fi

      - name: Start target app
        if: ${{ inputs.target_image != '' && inputs.target_url == '' }}
        env:
          APP_SECRETS: ${{ secrets.APP_SECRETS }}
        run: |
          docker rm -f target-app 2>/dev/null || true

          # Construir flags -e para cada variable de APP_SECRETS
          # Formato esperado: "KEY1=val1,KEY2=val2,KEY3=val3"
          ENV_FLAGS=""
          if [ -n "$APP_SECRETS" ]; then
            IFS=',' read -ra VARS <<< "$APP_SECRETS"
            for VAR in "${VARS[@]}"; do
              VAR_TRIMMED=$(echo "$VAR" | xargs)
              if [ -n "$VAR_TRIMMED" ]; then
                ENV_FLAGS="$ENV_FLAGS -e $VAR_TRIMMED"
              fi
            done
            echo "🔑 Inyectando $(echo $APP_SECRETS | tr ',' '\n' | wc -l) variables de entorno"
          fi

          docker run -d --name target-app \
            -p ${{ inputs.target_port }}:${{ inputs.target_port }} \
            $ENV_FLAGS \
            ${{ inputs.target_image }}

          echo "Esperando app en localhost:${{ inputs.target_port }}..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 3 --connect-timeout 3 \
              http://localhost:${{ inputs.target_port }} 2>/dev/null || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "304" ] || [ "$STATUS" = "404" ]; then
              echo "✅ App lista (HTTP $STATUS)"; break
            fi
            if [ "$i" = "40" ]; then
              echo "⚠️ App no respondió tras 200s — continuando de todas formas"
              docker logs target-app --tail 30 || true
            fi
            sleep 5
          done

      - name: Set target URL
        id: target
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            echo "url=${{ inputs.target_url }}" >> $GITHUB_OUTPUT
          else
            echo "url=http://localhost:${{ inputs.target_port }}" >> $GITHUB_OUTPUT
          fi

      - name: Install recon tools
        run: |
          sudo apt-get install -y nmap curl wget unzip 2>/dev/null || true
          pip install wafw00f --break-system-packages 2>/dev/null || true

          FFUF_VERSION="2.1.0"
          wget -q "https://github.com/ffuf/ffuf/releases/download/v${FFUF_VERSION}/ffuf_${FFUF_VERSION}_linux_amd64.tar.gz" \
            -O /tmp/ffuf.tar.gz && \
            tar -xzf /tmp/ffuf.tar.gz -C /tmp/ && \
            sudo mv /tmp/ffuf /usr/local/bin/ffuf && \
            chmod +x /usr/local/bin/ffuf && \
            echo "✅ ffuf instalado" || echo "⚠️ ffuf no disponible"

          HTTPX_VERSION="1.6.9"
          wget -q "https://github.com/projectdiscovery/httpx/releases/download/v${HTTPX_VERSION}/httpx_${HTTPX_VERSION}_linux_amd64.zip" \
            -O /tmp/httpx.zip && \
            unzip -q /tmp/httpx.zip -d /tmp/httpx_bin && \
            sudo mv /tmp/httpx_bin/httpx /usr/local/bin/httpx && \
            chmod +x /usr/local/bin/httpx && \
            echo "✅ httpx instalado" || echo "⚠️ httpx no disponible"

      - name: Run reconocimiento
        run: |
          mkdir -p results
          python3 scripts/recon.py \
            --target "${{ steps.target.outputs.url }}" \
            --output results/recon_context.json || true

      - name: Validar recon_context
        if: always()
        run: |
          mkdir -p results
          TARGET="${{ steps.target.outputs.url }}"
          python3 -c "
          import json
          try:
              d = json.load(open('results/recon_context.json'))
              if not d.get('nuclei_targets'):
                  d['nuclei_targets'] = ['$TARGET']
              assert d.get('schema_version')
              with open('results/recon_context.json', 'w') as f:
                  json.dump(d, f, indent=2)
              print(f'✅ recon_context válido: {len(d[\"nuclei_targets\"])} targets')
          except Exception as e:
              print(f'⚠️ Regenerando recon_context: {e}')
              fallback = {
                  'schema_version': '1.0',
                  'target_url': '$TARGET',
                  'nuclei_targets': ['$TARGET'],
                  'summary': {
                      'open_ports': [${{ inputs.target_port }}],
                      'discovered_routes_count': 0,
                      'technologies': [],
                      'waf_present': False,
                      'missing_security_headers': [],
                      'attack_surface_findings': 0,
                  }
              }
              with open('results/recon_context.json', 'w') as f:
                  json.dump(fallback, f, indent=2)
          "

      - name: Upload recon results
        uses: actions/upload-artifact@v4
        with:
          name: recon-results
          path: results/recon_context.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: DAST — OWASP ZAP (ASC-DAST-001)
  # ───────────────────────────────────────────────────────────────────────────
  dast:
    name: "Job 4 — DAST (OWASP ZAP) [ASC-DAST-001]"
    runs-on: ubuntu-latest
    needs: [detector, recon]
    if: needs.detector.outputs.dast_enabled == 'true'
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Login GHCR (imágenes privadas)
        if: ${{ inputs.use_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull imagen Docker
        if: ${{ inputs.target_image != '' && inputs.target_url == '' }}
        run: |
          docker rm -f target-app 2>/dev/null || true
          if [ -n "${{ inputs.build_context }}" ]; then
            docker build -t ${{ inputs.target_image }} ${{ inputs.build_context }}
          else
            docker pull ${{ inputs.target_image }}
          fi

      - name: Start target app
        if: ${{ inputs.target_image != '' && inputs.target_url == '' }}
        env:
          APP_SECRETS: ${{ secrets.APP_SECRETS }}
        run: |
          docker rm -f target-app 2>/dev/null || true

          ENV_FLAGS=""
          if [ -n "$APP_SECRETS" ]; then
            IFS=',' read -ra VARS <<< "$APP_SECRETS"
            for VAR in "${VARS[@]}"; do
              VAR_TRIMMED=$(echo "$VAR" | xargs)
              [ -n "$VAR_TRIMMED" ] && ENV_FLAGS="$ENV_FLAGS -e $VAR_TRIMMED"
            done
            echo "🔑 Inyectando variables de entorno para ZAP"
          fi

          docker run -d --name target-app \
            -p ${{ inputs.target_port }}:${{ inputs.target_port }} \
            $ENV_FLAGS \
            ${{ inputs.target_image }}

          echo "Esperando app en localhost:${{ inputs.target_port }}..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 3 --connect-timeout 3 \
              http://localhost:${{ inputs.target_port }} 2>/dev/null || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "304" ] || [ "$STATUS" = "404" ]; then
              echo "✅ App lista (HTTP $STATUS)"; break
            fi
            if [ "$i" = "40" ]; then
              echo "⚠️ App no respondió — continuando de todas formas"
              docker logs target-app --tail 30 || true
            fi
            sleep 5
          done

      - name: Download recon results
        uses: actions/download-artifact@v4
        with:
          name: recon-results
          path: results/
        continue-on-error: true

      - name: Run ZAP Baseline
        run: |
          mkdir -p results
          chmod -R 777 results

          if [ -n "${{ inputs.target_url }}" ]; then
            TARGET_URL="${{ inputs.target_url }}"
          else
            TARGET_URL="http://localhost:${{ inputs.target_port }}"
          fi
          echo "ZAP target: $TARGET_URL"

          docker run --rm \
            --network host \
            -v $(pwd)/results:/zap/wrk:rw \
            -u root \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "$TARGET_URL" \
            -J /zap/wrk/zap_results.json \
            -r /zap/wrk/zap_report.html \
            -l WARN -I || true

          if [ ! -f results/zap_results.json ] || [ ! -s results/zap_results.json ]; then
            echo '{"site":[{"alerts":[]}],"@version":"2.14.0"}' > results/zap_results.json
          fi

          COUNT=$(python3 -c "
          import json
          d = json.load(open('results/zap_results.json'))
          print(sum(len(s.get('alerts',[])) for s in d.get('site',[])))
          " 2>/dev/null || echo 0)
          echo "ZAP done: $COUNT alertas"

      - name: Upload DAST results
        uses: actions/upload-artifact@v4
        with:
          name: dast-results
          path: results/zap_results.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5: Pentesting — Nuclei v3 (ASC-PENTEST-001)
  # ───────────────────────────────────────────────────────────────────────────
  pentest:
    name: "Job 5 — Pentesting (Nuclei v3) [ASC-PENTEST-001]"
    runs-on: ubuntu-latest
    needs: [detector, recon]
    if: needs.detector.outputs.dast_enabled == 'true'
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Login GHCR (imágenes privadas)
        if: ${{ inputs.use_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull imagen Docker
        if: ${{ inputs.target_image != '' && inputs.target_url == '' }}
        run: |
          docker rm -f target-app 2>/dev/null || true
          if [ -n "${{ inputs.build_context }}" ]; then
            docker build -t ${{ inputs.target_image }} ${{ inputs.build_context }}
          else
            docker pull ${{ inputs.target_image }}
          fi

      - name: Start target app
        if: ${{ inputs.target_image != '' && inputs.target_url == '' }}
        env:
          APP_SECRETS: ${{ secrets.APP_SECRETS }}
        run: |
          docker rm -f target-app 2>/dev/null || true

          ENV_FLAGS=""
          if [ -n "$APP_SECRETS" ]; then
            IFS=',' read -ra VARS <<< "$APP_SECRETS"
            for VAR in "${VARS[@]}"; do
              VAR_TRIMMED=$(echo "$VAR" | xargs)
              [ -n "$VAR_TRIMMED" ] && ENV_FLAGS="$ENV_FLAGS -e $VAR_TRIMMED"
            done
            echo "🔑 Inyectando variables de entorno para Nuclei"
          fi

          docker run -d --name target-app \
            -p ${{ inputs.target_port }}:${{ inputs.target_port }} \
            $ENV_FLAGS \
            ${{ inputs.target_image }}

          echo "Esperando app en localhost:${{ inputs.target_port }}..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 3 --connect-timeout 3 \
              http://localhost:${{ inputs.target_port }} 2>/dev/null || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "304" ]; then
              echo "✅ App lista (HTTP $STATUS)"; break
            fi
            if [ "$i" = "40" ]; then
              echo "⚠️ App no respondió — continuando de todas formas"
              docker logs target-app --tail 30 || true
            fi
            sleep 5
          done

      - name: Download recon results
        uses: actions/download-artifact@v4
        with:
          name: recon-results
          path: results/
        continue-on-error: true

      - name: Install Nuclei v3.3.8
        run: |
          wget -q https://github.com/projectdiscovery/nuclei/releases/download/v3.3.8/nuclei_3.3.8_linux_amd64.zip \
            -O /tmp/nuclei.zip
          unzip -q /tmp/nuclei.zip -d /tmp/nuclei_bin
          sudo mv /tmp/nuclei_bin/nuclei /usr/local/bin/nuclei
          chmod +x /usr/local/bin/nuclei
          nuclei -version

      - name: Update Nuclei templates
        run: nuclei -update-templates -silent || true

      - name: Set target URL
        id: target
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            echo "url=${{ inputs.target_url }}" >> $GITHUB_OUTPUT
          else
            echo "url=http://localhost:${{ inputs.target_port }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Nuclei con rutas del recon
        run: |
          mkdir -p results
          TARGET="${{ steps.target.outputs.url }}"

          python3 -c "
          import json
          try:
              d = json.load(open('results/recon_context.json'))
              targets = d.get('nuclei_targets', [])
              if not targets:
                  targets = ['$TARGET']
              with open('/tmp/nuclei_targets.txt', 'w') as f:
                  f.write('\n'.join(targets))
              print(f'✅ {len(targets)} targets para Nuclei')
          except Exception as e:
              print(f'⚠️ Usando target base: {e}')
              open('/tmp/nuclei_targets.txt','w').write('$TARGET')
          "

          nuclei \
            -list /tmp/nuclei_targets.txt \
            -tags owasp,jwt,sqli,xss,exposure,misconfig,cve,token,auth,api,swagger \
            -severity info,low,medium,high,critical \
            -json-export results/nuclei_results.json \
            -timeout 30 \
            -rate-limit 50 \
            -silent || true

          if [ ! -f results/nuclei_results.json ] || [ ! -s results/nuclei_results.json ]; then
            echo '[]' > results/nuclei_results.json
          fi

          COUNT=$(python3 -c "
          import json
          raw = open('results/nuclei_results.json').read().strip()
          if raw.startswith('['):
              print(len(json.loads(raw)))
          else:
              print(len([l for l in raw.splitlines() if l.strip()]))
          " 2>/dev/null || echo 0)
          echo "Nuclei done: $COUNT findings"

      - name: Upload pentest results
        uses: actions/upload-artifact@v4
        with:
          name: pentest-results
          path: results/nuclei_results.json

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6: Evaluación — Normalización + Gate IA + SSVC + ISO 27034
  # ───────────────────────────────────────────────────────────────────────────
  evaluation:
    name: "Job 6 — Evaluación (Normalización + Gate IA + SSVC + ISO 27034)"
    runs-on: ubuntu-latest
    needs: [detector, sast, sca, recon, dast, pentest]
    if: always()

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: ManuelArango1229/devsecops-engine-
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install requests openai anthropic groq --quiet

      - name: Crear directorio de resultados
        run: mkdir -p results

      # ── Descargar artefactos de jobs anteriores ─────────────────────────────
      - name: Download scan_config
        uses: actions/download-artifact@v4
        with:
          name: scan-config
          path: results/
        continue-on-error: true

      - name: Download SAST results
        uses: actions/download-artifact@v4
        with:
          name: sast-results
          path: results/
        continue-on-error: true

      - name: Download SCA results
        uses: actions/download-artifact@v4
        with:
          name: sca-results
          path: results/
        continue-on-error: true

      - name: Download recon results
        uses: actions/download-artifact@v4
        with:
          name: recon-results
          path: results/
        continue-on-error: true

      - name: Download DAST results
        uses: actions/download-artifact@v4
        with:
          name: dast-results
          path: results/
        continue-on-error: true

      - name: Download pentest results
        uses: actions/download-artifact@v4
        with:
          name: pentest-results
          path: results/
        continue-on-error: true

      # ── Crear archivos vacíos para herramientas que no ejecutaron ────────────
      - name: Asegurar archivos de resultados
        run: |
          mkdir -p results
          # Crear archivos con JSON vacío válido si no existen o están vacíos
          [ -s results/semgrep_results.json ] || echo '{"results":[],"errors":[]}' > results/semgrep_results.json
          [ -s results/trivy_results.json ]   || echo '{"Results":[]}'             > results/trivy_results.json
          [ -s results/zap_results.json ]     || echo '{"site":[]}'                > results/zap_results.json
          [ -s results/nuclei_results.json ]  || echo '[]'                         > results/nuclei_results.json
          [ -s results/recon_context.json ]   || echo '{"target_url":"","summary":{}}' > results/recon_context.json
          [ -s results/scan_config.json ]     || echo '{}' > results/scan_config.json

          # scan_config mínimo con ANF si el detector falló
          python3 -c "
          import json, os
          cfg_path = 'results/scan_config.json'
          if os.path.getsize(cfg_path) == 0:
              json.dump({
                  'service': '${{ inputs.service_name }}',
                  'language': '${{ inputs.language }}',
                  'business_criticality': '${{ inputs.criticality }}',
                  'environment': '${{ inputs.environment }}',
                  'scan_mode': 'image' if '${{ inputs.target_image }}' else 'url',
                  'iso27034_anf': {
                      'required_ascs': [
                          'ASC-SAST-001',
                          'ASC-SCA-001',
                          'ASC-DAST-001',
                          'ASC-PENTEST-001'
                      ],
                      'optional_ascs': []
                  }
              }, open(cfg_path, 'w'), indent=2)
          " || true

      # ── Paso 1: Normalización y deduplicación ──────────────────────────────
      - name: Normalización de hallazgos
        run: |
          python scripts/normalizer.py \
            --semgrep results/semgrep_results.json \
            --trivy   results/trivy_results.json \
            --zap     results/zap_results.json \
            --nuclei  results/nuclei_results.json \
            --output  results/findings.json

          # Inyectar metadatos de servicio y scan_config en findings.json
          python3 -c "
          import json, os
          findings = json.load(open('results/findings.json'))
          findings['service']              = '${{ inputs.service_name }}'
          findings['environment']          = '${{ inputs.environment }}'
          findings['business_criticality'] = '${{ inputs.criticality }}'
          findings['pipeline_run']         = os.environ.get('GITHUB_RUN_ID', 'local')
          # Propagar asc_id desde scan_config si el normalizer no lo hace
          cfg_path = 'results/scan_config.json'
          if os.path.exists(cfg_path) and os.path.getsize(cfg_path) > 0:
              cfg = json.load(open(cfg_path))
              tool_asc = {
                  'semgrep': 'ASC-SAST-001',
                  'trivy':   'ASC-SCA-001',
                  'zap':     'ASC-DAST-001',
                  'nuclei':  'ASC-PENTEST-001',
              }
              for f in findings.get('findings', []):
                  if not f.get('asc_id'):
                      f['asc_id'] = tool_asc.get(f.get('tool',''), '')
          json.dump(findings, open('results/findings.json','w'), indent=2)
          "

      # ── Paso 2: Gate SSVC + EPSS + CISA KEV ───────────────────────────────
      - name: Gate SSVC + EPSS + CISA KEV
        run: |
          python scripts/ssvc_gate.py \
            results/findings.json \
            "${{ inputs.criticality }}" \
            > results/ssvc_result.json 2>/dev/null || echo '{}' > results/ssvc_result.json
        continue-on-error: true

      # ── Paso 3: Motor de evaluación IA híbrida ─────────────────────────────
      - name: Evaluación IA híbrida (LLaMA 3.3 70B + fallback)
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/ai_engine.py \
            --findings    results/findings.json \
            --service     "${{ inputs.service_name }}" \
            --criticality "${{ inputs.criticality }}" \
            --environment "${{ inputs.environment }}" \
            --output      results/ai_evaluation.json

      # ── Paso 4: Security Gate (consolidación 3 enfoques) ──────────────────
      - name: Security Gate (tradicional + IA + SSVC)
        run: |
          python scripts/gate.py \
            --findings      results/findings.json \
            --ai-evaluation results/ai_evaluation.json \
            --criticality   "${{ inputs.criticality }}" \
            --output        results/gate_decision.json

      # ── Paso 5: Reporte con trazabilidad ISO/IEC 27034 ────────────────────
      - name: Generar reporte SECURITY_REPORT.md
        run: |
          python scripts/report_generator.py \
            --findings      results/findings.json \
            --ai-evaluation results/ai_evaluation.json \
            --gate-decision results/gate_decision.json \
            --recon         results/recon_context.json \
            --scan-config   results/scan_config.json \
            --output        results/SECURITY_REPORT.md

      # ── Subir todos los artefactos finales ────────────────────────────────
      - name: Upload resultados finales
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-results-${{ inputs.service_name }}
          path: |
            results/scan_config.json
            results/findings.json
            results/ssvc_result.json
            results/ai_evaluation.json
            results/gate_decision.json
            results/SECURITY_REPORT.md

      # ── Mostrar decisión en el log ─────────────────────────────────────────
      - name: Mostrar decisión de despliegue
        if: always()
        run: |
          echo "=================================================="
          echo "  DECISIÓN DEL SECURITY GATE"
          echo "=================================================="
          python3 -c "
          import json
          try:
              gate = json.load(open('results/gate_decision.json'))
              dec  = gate.get('decision', 'UNKNOWN')
              src  = gate.get('decision_source', 'N/A')
              icon = {'PASS':'✅','FAIL':'❌','CONDITIONAL':'⚠️'}.get(dec,'❓')
              print(f'  {icon} Decisión:  {dec}')
              print(f'  📋 Fuente:    {src}')
              ssvc = gate.get('gate_comparison',{}).get('ssvc',{})
              f1   = ssvc.get('f1_metrics',{}).get('f1_score','N/A')
              agg  = ssvc.get('aggregate_action','N/A')
              print(f'  🔬 SSVC:      {ssvc.get(\"decision\",\"N/A\")} ({agg})')
              print(f'  📊 F1 Score:  {f1}')
              tra  = gate.get('iso27034_traceability', {})
              bd   = tra.get('asc_breakdown', [])
              req  = [b for b in bd if b.get('required')]
              exr  = [b for b in req if b.get('status') == 'executed']
              print(f'  📋 ISO 27034: {len(exr)}/{len(req)} ASC obligatorios ejecutados')
          except Exception as e:
              print(f'  ⚠️  No se pudo leer gate_decision.json: {e}')
          " || true
          echo "=================================================="

      # ── Forzar fallo si la decisión es FAIL ───────────────────────────────
      - name: Verificar decisión de despliegue
        run: |
          DECISION=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('results/gate_decision.json')).get('decision','UNKNOWN')
              print(d)
          except:
              print('UNKNOWN')
          " 2>/dev/null || echo "UNKNOWN")

          echo "Decisión: $DECISION"

          if [ "$DECISION" = "FAIL" ]; then
            echo "❌ El Security Gate bloqueó el despliegue (FAIL)."
            echo "   Revisa SECURITY_REPORT.md en los artefactos para los detalles."
            exit 1
          elif [ "$DECISION" = "CONDITIONAL" ]; then
            echo "⚠️  CONDITIONAL — revisar SECURITY_REPORT.md antes de promover a producción."
          else
            echo "✅ PASS — El despliegue puede proceder."
          fi